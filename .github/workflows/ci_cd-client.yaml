name: Deploy Frontend

on:
  push:
    branches:
      - master
    paths: # runs on these changes
      - "apps/client/**"
      - "docker/Dockerfile.client"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.client
          push: true
          tags: |
            aniketraj28/todo-monorepo-client:latest
            aniketraj28/todo-monorepo-client:${{ github.sha }}
